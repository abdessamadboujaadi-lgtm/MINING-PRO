
name: Build MINING PRO Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MINING_PRO_Android_AdMob_Phone_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q MINING_PRO_Android_AdMob_Phone_Build.zip -d extracted
          test -f extracted/MINING_PRO_Android_AdMob/gradlew

      - name: Build APK
        working-directory: extracted/MINING_PRO_Android_AdMob
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MINING-PRO-Simulator-APK
          path: extracted/MINING_PRO_Android_AdMob/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
