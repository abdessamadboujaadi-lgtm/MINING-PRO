
name: Build MINING PRO Simulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q MINING_PRO_Android_AdMob_Phone_Build.zip -d extracted
          test -f extracted/MINING_PRO_Android_AdMob/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        working-directory: extracted/MINING_PRO_Android_AdMob
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MINING-PRO-APK
          path: extracted/MINING_PRO_Android_AdMob/app/build/outputs/apk/debug/*.apk
