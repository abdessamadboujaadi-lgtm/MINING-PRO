name: Build MINING PRO Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MINING_PRO_Android_AdMob_Phone_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q MINING_PRO_Android_AdMob_Phone_Build.zip -d extracted
          test -f extracted/MINING_PRO_Android_AdMob/build.gradle
          test -f extracted/MINING_PRO_Android_AdMob/settings.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted/MINING_PRO_Android_AdMob
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MINING-PRO-Simulator-APK
          path: extracted/MINING_PRO_Android_AdMob/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
