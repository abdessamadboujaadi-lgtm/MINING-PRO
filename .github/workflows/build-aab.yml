
name: Build MINING PRO Signed AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q MINING_PRO_Android_AdMob_Phone_Build.zip -d extracted

      - name: Prepare and validate signing key
        env:
          KEY_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        run: |
          test -n "$KEY_BASE64" || { echo "Signing key secret is missing"; exit 1; }
          test -n "$KEY_STORE_PASSWORD" || { echo "Keystore password secret is missing"; exit 1; }
          printf '%s' "$KEY_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > "$RUNNER_TEMP/miningpro-release.jks"
          test -s "$RUNNER_TEMP/miningpro-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/miningpro-release.jks" -storepass "$KEY_STORE_PASSWORD" >/dev/null
          echo "Signing keystore decoded and validated successfully."

      - name: Create signing configuration
        run: |
          cat > "$RUNNER_TEMP/signing.init.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              def androidExt = p.extensions.findByName("android")
              if (androidExt != null && p.plugins.hasPlugin("com.android.application")) {
                def cfg = androidExt.signingConfigs.findByName("release")
                if (cfg == null) {
                  cfg = androidExt.signingConfigs.create("release")
                }
                cfg.storeFile = new File(System.getenv("SIGNING_KEY_STORE_PATH"))
                cfg.storePassword = System.getenv("SIGNING_KEY_STORE_PASSWORD")
                cfg.keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                cfg.keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
                androidExt.buildTypes.getByName("release").signingConfig = cfg
              }
            }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build signed AAB
        working-directory: extracted/MINING_PRO_Android_AdMob
        env:
          SIGNING_KEY_STORE_PATH: ${{ runner.temp }}/miningpro-release.jks
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle -I "$RUNNER_TEMP/signing.init.gradle" bundleRelease

      - name: Verify signature
        run: |
          AAB=$(find extracted -name "*.aab" -print -quit)
          test -n "$AAB"
          jarsigner -verify "$AAB"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MINING-PRO-AAB-SIGNED
          path: extracted/MINING_PRO_Android_AdMob/app/build/outputs/bundle/release/*.aab
